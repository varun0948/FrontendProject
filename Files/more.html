<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #222;
    }

    ::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* Apply Inter font globally */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #141414;
      /* Dark background for Netflix feel */
      color: #e5e5e5;
      /* Light text for contrast */
      overflow-x: hidden;
      /* Prevent horizontal scrollbar on body */
    }

    /* Custom styles for movie row scrolling */
    .movie-row-scroll {
      overflow-x: scroll;
      -webkit-overflow-scrolling: touch;
      /* Smooth scrolling on touch devices */
      scrollbar-width: none;
      /* Hide scrollbar for Firefox */
      -ms-overflow-style: none;
      /* Hide scrollbar for IE and Edge */
    }

    .movie-row-scroll::-webkit-scrollbar {
      display: none;
      /* Hide scrollbar for Chrome, Safari, Opera */
    }

    /* Modal backdrop for blur effect */
    .modal-backdrop {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      /* Safari support */
    }

    /* Gradient overlay for hero section */
    .hero-gradient-overlay {
      background: linear-gradient(to top, rgba(20, 20, 20, 1) 0%, rgba(20, 20, 20, 0) 50%, rgba(20, 20, 20, 1) 100%);
    }

    /* Custom animation for modal fade-in */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }

    /* Custom animation for modal fade-out */
    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }

      to {
        opacity: 0;
        transform: translateY(-20px);
      }
    }

    .animate-fade-out {
      animation: fadeOut 0.3s ease-out forwards;
    }

    /* Aspect ratio for video player */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      background-color: black;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

        backdrop: 'https://images.unsplash.com/photo-1620712948281-c7c1a2f6c0f3?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.0.3&q=80&w=1280',

        backdrop: 'https://images.unsplash.com/photo-1620712948281-c7c1a2f6c0f3?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.0.3&q=80&w=1280',
        year: 2018,

      },
      {
        id: 'm15',
        title: 'Enola Holmes',
        genre: 'Mystery, Adventure',
        description: 'Teenage Enola Holmes uses her detective skills to outsmart her famous brother Sherlock and help a runaway heiress.',
        thumbnail: 'https://images.unsplash.com/photo-1620712948281-c7c1a2f6c0f3?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.0.3&q=80&w=300',
        backdrop: 'https://images.unsplash.com/photo-1620712948281-c7c1a2f6c0f3?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.0.3&q=80&w=1280',
        year: 2020,
        rating: '84% Match',
        videoUrl: 'https://www.youtube.com/embed/1d0Zf9sXlHk?autoplay=1&modestbranding=1&rel=0' // Enola Holmes Official Trailer
      }
    ];

    // Categories of movies to display
    const categories = {
      'Trending Now': moviesData.slice(0, 5),
      'New Releases': moviesData.slice(5, 10),
      'Critically Acclaimed': moviesData.slice(10, 15),
      'Action & Adventure': moviesData.filter(m => m.genre.includes('Action')),
      'Dramas': moviesData.filter(m => m.genre.includes('Drama'))
    };

    // DOM Elements
    const navbar = document.getElementById('navbar');
    const heroSection = document.getElementById('heroSection');
    const heroTitle = document.getElementById('heroTitle');
    const heroDescription = document.getElementById('heroDescription');
    const movieCategoriesContainer = document.getElementById('movieCategoriesContainer');
    const movieModal = document.getElementById('movieModal');
    const modalContent = document.getElementById('modalContent');
    const closeModalButton = document.getElementById('closeModalButton');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalTitle = document.getElementById('modalTitle');
    const modalYear = document.getElementById('modalYear');
    const modalRating = document.getElementById('modalRating');
    const modalDescription = document.getElementById('modalDescription');
    const modalGenres = document.getElementById('modalGenres');
    const myListToggleButton = document.getElementById('myListToggleButton');
    const myListIcon = document.getElementById('myListIcon');
    const myListButtonText = document.getElementById('myListButtonText');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const searchResultsSection = document.getElementById('searchResultsSection');
    const searchResultsContainer = document.getElementById('searchResultsContainer');
    const noSearchResults = document.getElementById('noSearchResults');
    const myListNav = document.getElementById('myListNav');

    // New DOM elements for video playback
    const modalVideoPlayer = document.getElementById('modalVideoPlayer');
    const modalVideoFrame = document.getElementById('modalVideoFrame');
    const modalDetailsSection = document.getElementById('modalDetailsSection');
    const modalPlayButton = document.getElementById('modalPlayButton');
    const backToDetailsButton = document.getElementById('backToDetailsButton');

    let myMovieList = []; // Array to store IDs of movies in "My List"
    let currentModalMovieId = null; // Store the ID of the movie currently in the modal

    /**
     * Initializes the hero section with a random movie.
     */
    function initializeHeroSection() {
      const featuredMovie = moviesData[Math.floor(Math.random() * moviesData.length)];
      heroSection.style.backgroundImage = `url('${featuredMovie.backdrop}')`;
      heroTitle.textContent = featuredMovie.title;
      heroDescription.textContent = featuredMovie.description;
    }

    /**
     * Creates a movie thumbnail element.
     * @param {Object} movie - The movie object.
     * @returns {HTMLElement} The created thumbnail element.
     */
    function createMovieThumbnail(movie) {
      const img = document.createElement('img');
      img.src = movie.thumbnail;
      img.alt = movie.title;
      img.classList.add('w-full', 'h-auto', 'rounded-lg', 'object-cover', 'cursor-pointer', 'transform', 'transition-transform', 'duration-300', 'hover:scale-105', 'hover:shadow-xl', 'hover:ring-2', 'hover:ring-white');
      img.dataset.movieId = movie.id; // Store movie ID for modal
      img.onerror = () => {
        // Fallback image using placehold.co if the provided image URL fails
        img.src = `https://placehold.co/300x169/222/FFF?text=${encodeURIComponent(movie.title)}`;
      };
      return img;
    }

    /**
     * Renders movie rows for each category.
     */
    function renderMovieRows() {
      movieCategoriesContainer.innerHTML = ''; // Clear previous content

      // Render "My List" row if it has items
      if (myMovieList.length > 0) {
        const myListMovies = moviesData.filter(movie => myMovieList.includes(movie.id));
        createMovieRow('My List', myListMovies, true);
      } else {
        // If "My List" is empty, remove it from categories if it was there.
        const existingMyListRow = document.getElementById('my-list-row');
        if (existingMyListRow) {
          existingMyListRow.remove();
        }
      }

      // Render other categories
      for (const categoryName in categories) {
        // Skip rendering "My List" if it's already handled above
        if (categoryName === 'My List' && myMovieList.length > 0) {
          continue;
        }
        createMovieRow(categoryName, categories[categoryName]);
      }
    }

    /**
     * Creates and appends a movie row to the container.
     * @param {string} title - The title of the row (e.g., "Trending Now").
     * @param {Array<Object>} movies - Array of movie objects for this row.
     * @param {boolean} isMyList - True if this is the "My List" row.
     */
    function createMovieRow(title, movies, isMyList = false) {
      if (movies.length === 0) return; // Don't create empty rows

      const section = document.createElement('section');
      section.classList.add('mb-8');
      if (isMyList) {
        section.id = 'my-list-row'; // Add ID for easy access
      }

      const h2 = document.createElement('h2');
      h2.classList.add('text-xl', 'md:text-2xl', 'font-bold', 'text-white', 'mb-4', 'pl-2');
      h2.textContent = title;
      section.appendChild(h2);

      const div = document.createElement('div');
      div.classList.add('flex', 'space-x-3', 'movie-row-scroll', 'pb-4', 'px-2'); // Added px-2 for padding

      movies.forEach(movie => {
        const thumbnail = createMovieThumbnail(movie);
        div.appendChild(thumbnail);
      });

      section.appendChild(div);
      movieCategoriesContainer.appendChild(section);
    }

    /**
     * Opens the movie details modal.
     * @param {Object} movie - The movie object to display.
     */
    function openModal(movie) {
      currentModalMovieId = movie.id; // Set current movie ID

      // Reset modal to show details section and hide video player
      modalDetailsSection.classList.remove('hidden');
      modalVideoPlayer.classList.add('hidden');
      modalVideoFrame.src = ''; // Clear video source

      modalBackdrop.style.backgroundImage = `url('${movie.backdrop}')`;
      modalBackdrop.onerror = () => {
        // Fallback image for backdrop if the provided image URL fails
        modalBackdrop.style.backgroundImage = `url('https://placehold.co/1280x720/333/FFF?text=${encodeURIComponent(movie.title)}+Backdrop')`;
      };
      modalTitle.textContent = movie.title;
      modalYear.textContent = movie.year;
      modalRating.textContent = movie.rating;
      modalDescription.textContent = movie.description;
      modalGenres.textContent = movie.genre;

      // Update My List button status
      updateMyListButton(movie.id);

      // Show modal with animation
      movieModal.classList.remove('hidden');
      movieModal.classList.add('flex');
      modalContent.classList.remove('opacity-0', 'scale-95', 'animate-fade-out');
      modalContent.classList.add('animate-fade-in');

      // Store current movie ID in button for easy access
      myListToggleButton.dataset.movieId = movie.id;
      modalPlayButton.dataset.movieId = movie.id; // Also store on play button
    }

    /**
     * Closes the movie details modal.
     */
    function closeModal() {
      modalContent.classList.remove('animate-fade-in');
      modalContent.classList.add('animate-fade-out');
      modalContent.addEventListener('animationend', () => {
        movieModal.classList.add('hidden');
        movieModal.classList.remove('flex');
        modalContent.classList.remove('animate-fade-out'); // Clean up class
        modalVideoFrame.src = ''; // Stop video playback when modal closes
      }, { once: true }); // Ensure listener is removed after one use
    }

    /**
     * Toggles a movie in/out of "My List".
     * @param {string} movieId - The ID of the movie to toggle.
     */
    function toggleMyList(movieId) {
      const index = myMovieList.indexOf(movieId);
      if (index > -1) {
        myMovieList.splice(index, 1); // Remove from list
      } else {
        myMovieList.push(movieId); // Add to list
      }
      updateMyListButton(movieId); // Update button text/icon
      renderMovieRows(); // Re-render rows to update "My List" section
    }

    /**
     * Updates the text and icon of the "My List" button in the modal.
     * @param {string} movieId - The ID of the movie.
     */
    function updateMyListButton(movieId) {
      if (myMovieList.includes(movieId)) {
        myListIcon.innerHTML = `<path d="M20 6 9 17l-5-5"/>`; // Check icon
        myListButtonText.textContent = 'Remove from My List';
      } else {
        myListIcon.innerHTML = `<path d="M12 5v14"/><path d="M5 12h14"/>`; // Plus icon
        myListButtonText.textContent = 'Add to My List';
      }
    }

    /**
     * Plays the video for the current movie in the modal.
     * @param {string} movieId - The ID of the movie whose video should play.
     */
    function playMovieVideo(movieId) {
      const movie = moviesData.find(m => m.id === movieId);
      if (movie && movie.videoUrl) {
        modalDetailsSection.classList.add('hidden'); // Hide details
        modalVideoPlayer.classList.remove('hidden'); // Show video player
        modalVideoFrame.src = movie.videoUrl; // Set video source
      } else {
        console.warn('No video URL found for this movie or movie not found:', movieId);
        // Optionally, show a message to the user that no video is available
      }
    }

    /**
     * Returns from video playback to movie details in the modal.
     */
    function showMovieDetails() {
      modalVideoPlayer.classList.add('hidden'); // Hide video player
      modalVideoFrame.src = ''; // Stop video playback
      modalDetailsSection.classList.remove('hidden'); // Show details
    }

    /**
     * Performs a client-side search and displays results.
     * @param {string} query - The search query.
     */
    function performSearch(query) {
      const normalizedQuery = query.toLowerCase().trim();
      searchResultsContainer.innerHTML = ''; // Clear previous results

      if (normalizedQuery.length === 0) {
        searchResultsSection.classList.add('hidden');
        noSearchResults.classList.add('hidden');
        movieCategoriesContainer.classList.remove('hidden'); // Show regular categories
        return;
      }

      const filteredMovies = moviesData.filter(movie =>
        movie.title.toLowerCase().includes(normalizedQuery) ||
        movie.description.toLowerCase().includes(normalizedQuery) ||
        movie.genre.toLowerCase().includes(normalizedQuery)
      );

      movieCategoriesContainer.classList.add('hidden'); // Hide regular categories
      searchResultsSection.classList.remove('hidden');

      if (filteredMovies.length > 0) {
        noSearchResults.classList.add('hidden');
        filteredMovies.forEach(movie => {
          const thumbnail = createMovieThumbnail(movie);
          searchResultsContainer.appendChild(thumbnail);
        });
      } else {
        noSearchResults.classList.remove('hidden');
      }
    }

    // Event Listeners

    // Navbar scroll effect
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        navbar.classList.add('bg-black');
        navbar.classList.remove('from-black', 'to-transparent');
      } else {
        navbar.classList.remove('bg-black');
        navbar.classList.add('from-black', 'to-transparent');
      }
    });

    // Event delegation for opening modal on thumbnail click
    document.addEventListener('click', (event) => {
      if (event.target.tagName === 'IMG' && event.target.dataset.movieId) {
        const movieId = event.target.dataset.movieId;
        const movie = moviesData.find(m => m.id === movieId);
        if (movie) {
          openModal(movie);
        }
      }
    });

    // Close modal button
    closeModalButton.addEventListener('click', closeModal);

    // Close modal when clicking outside the content
    movieModal.addEventListener('click', (event) => {
      if (event.target === movieModal) {
        closeModal();
      }
    });

    // Toggle "My List" button in modal
    myListToggleButton.addEventListener('click', () => {
      const movieId = myListToggleButton.dataset.movieId;
      if (movieId) {
        toggleMyList(movieId);
      }
    });

    // Play button in modal
    modalPlayButton.addEventListener('click', () => {
      const movieId = modalPlayButton.dataset.movieId;
      if (movieId) {
        playMovieVideo(movieId);
      }
    });

    // Back to Details button in modal
    backToDetailsButton.addEventListener('click', showMovieDetails);

    // Search functionality
    searchButton.addEventListener('click', () => {
      // Toggle search input visibility on small screens
      if (window.innerWidth < 768) { // Tailwind's md breakpoint
        searchInput.classList.toggle('w-0');
        searchInput.classList.toggle('opacity-0');
        searchInput.classList.toggle('w-auto');
        searchInput.classList.toggle('opacity-100');
        searchInput.focus();
      }
    });

    searchInput.addEventListener('input', (event) => {
      performSearch(event.target.value);
    });

    // Navigate to My List section (if it exists)
    myListNav.addEventListener('click', (event) => {
      event.preventDefault(); // Prevent default link behavior
      const myListRow = document.getElementById('my-list-row');
      if (myListRow) {
        myListRow.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        // Optionally, show a message if My List is empty
        console.log("My List is empty!");
      }
    });

    // Initial setup on page load
    window.onload = function () {
      initializeHeroSection();
      renderMovieRows();
    };

  </script>
</body>

</html>
