<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Signup</title>
	<link rel="stylesheet" href="../CSS/signup.css" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
	<link rel="stylesheet" href="../Header/header.css" />
	<script src="../Script/signup.js"></script>

	<link rel="website icon " type="png" href="../Images/logo.jpg" />
</head>

<body>
	<div id="header"></div>
	<div class="hero-overlay">
		<div class="container">
			<div class="form">
				<h2>Register Yourself</h2>
				<form id="signup-form">
					<input type="text" class="input-box" placeholder="Enter your name" name="name" required />
					<input type="email" class="input-box" placeholder="Enter email" name="password" required />
					<input type="text" class="input-box" placeholder="Mobile Number" name="password" maxlength="10"
						required />
					<input type="password" class="input-box" placeholder="Password" name="password" maxlength="6"
						required />

					<input type="submit" class="btn" id="btnRegister" value="Next"><br />
					<p id="error-message" style="color: red; display: none">
						This email is already registered.
					</p>
				</form>
				<form id="verify-otp-form" class="hidden">
					<input type="text" class="input-box" id="otp-input" placeholder="Enter OTP" maxlength="4"
						required />
					<input type="submit" id="otp-btn" value="Verify OTP">
					<p id="otp-error-message" style="color: red; display: none">
						Invalid OTP. Please try again.
					</p>
				</form>
				<div class="icon">
					<i class="bi bi-google"></i>
					<i class="bi bi-facebook"></i>
					<i class="bi bi-linkedin"></i>
				</div>
			</div>
			<div id="sign-text">
				<p>
					Have an account? <a href="../Files/login.html" id="sign">Login</a>
				</p>
			</div>
		</div>
	</div>

	<script>
		// Load Header
		fetch("../Header/header.html")
			.then((response) => response.text())
			.then((data) => {
				document.getElementById("header").innerHTML = data;
			})
			.catch((error) => console.error("Error loading header:", error));
	</script>
</body>

</html>
