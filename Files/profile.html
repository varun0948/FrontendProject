<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | Travelin</title>
  <script src="../Script/profile.js"></script>
  <link rel="stylesheet" href="../CSS/profile.css" />
  <link rel="icon" type="image/png" href="../Images/logo.jpg" />
</head>

<body>
  <header id="header"></header>

  <h2 id="tag">Your Profile</h2>
  <main class="container">
    <div class="hero-overlay">

      <!-- Profile Card -->
      <section class="profile">
        <img id="profileImage" src="" alt="Profile Image" class="profile-pic" width="150">

        <div class="profile-container">
          <h3 id="userName"></h3>
          <p id="userEmail"></p>
          <p id="userPhone"></p>

          <p>Member Since: Jan 2023</p>
          <button onclick="editProfile()">Edit Profile</button>
          <button id="logoutBtn" onclick="logout()">Log Out</button>
        </div>
      </section>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="showTab('trips')">Upcoming Trips</button>
        <button class="tab" onclick="showTab('wishlist')">Wishlist</button>
        <button class="tab" onclick="showTab('settings')">Settings</button>
      </div>

      <!-- Tab Content -->
      <div class="tab-content" id="trips">
        <h3>Upcoming Trips</h3>
        <div id="upcoming-trips" class="trip-cards"></div>
      </div>

      <div class="tab-content hidden" id="wishlist">
        <h3>Your Wishlist</h3>
        <div class="wishlist-list" id="wishlistList">
          <div class="wishlist-item">
            <div class="icon">🏔</div>
            <div class="details">
              <h4>New Zealand Adventure</h4>
              <p>Experience mountains, lakes, and nature trails.</p>
            </div>
            <div class="actions">
              <button class="book">Book Now</button>
              <button class="remove">✖</button>
            </div>
          </div>

          <div class="wishlist-item">
            <div class="icon">🚢</div>
            <div class="details">
              <h4>Alaskan Cruise</h4>
              <p>Glacier views, sea breeze, and luxury sailing.</p>
            </div>
            <div class="actions">
              <button class="book">Book Now</button>
              <button class="remove">✖</button>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-content hidden" id="settings">
        <h3>Settings</h3>
      </div>
    </div>
  </main>
</body>

</html>

<script>
  // Load Header
  fetch("../Header/header.html")
    .then((response) => response.text())
    .then((data) => {
      document.getElementById("header").innerHTML = data;
    })
    .catch((error) => console.error("Error loading header:", error));

  // Wishlist remove button
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".wishlist-item .remove").forEach((button) => {
      button.addEventListener("click", function () {
        const item = this.closest(".wishlist-item");
        if (item) {
          item.style.transition = "opacity 0.5s";
          item.style.opacity = 0;
          setTimeout(() => item.remove(), 300);
        }
      });
    });
  });
</script>
