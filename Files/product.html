<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="../Styles/product.css">
    <link rel="stylesheet" href="../Header/header.css">
    <link rel="stylesheet" href="../Footer/footer.css">
    <script src="../Scripts/product.js"></script>
    <script src="../Scripts/home.js"></script>
    
    <link rel="website icon " type="png" href="../Images/logo.png">
</head>

<body>
    <div id="header"></div>

    <div class="product-details-container">
        <div class="product-image">
            <img id="productImg" src="" alt="Product Image">
        </div>

        <div class="product-info">
            <h2 id="productTitle"></h2>
            <p id="productDesc"></p>
            <span class="rating" data-rating="4.5"></span>
            <p id="productPrice">  
                
            </p>
            <button class="btn" onclick="addToCart()">Add to Cart</button>
            <button class="btn wishlist" onclick="addToWishlist()">Add to Wishlist</button>
        </div>
    </div>
    <hr class="hrStyle">
    <div class="related-products">
        <h3>Suggested Items</h3>
        <div class="product-list">
            <div class="product">
                <img src="/Images/perfumes2.jpg" alt="Perfume 1">
                <p>Momento Amour</p>
            </div>
            <div class="product">
                <img src="/Images/perfume7.jpg" alt="Perfume 2">
                <p>Laura Chaoutte</p>
            </div>
            <div class="product">
                <img src="/Images/perfume8.jpg" alt="Perfume 3">
                <p>Bleu De Chanel</p>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script>
        // Load Header
        fetch("../Header/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            })
            .catch(error => console.error("Error loading header:", error));

        // Load Footer
        fetch("../Footer/footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            })
            .catch(error => console.error("Error loading footer:", error));
    </script>
</body>

</html>
