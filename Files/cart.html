<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="../Styles/cart.css">
    <link rel="stylesheet" href="../Header/header.css">
    <link rel="stylesheet" href="../Footer/footer.css">
    <Script src="../Scripts/cart.js"></Script>
    <Script src="../Scripts/home.js"></Script>
</head>

<body>
    <div id="header"></div>

    <div class="cart-container">
        <div class="sub-head">

            <p id="products">Products </p  >
            <p id="Quntity">Quntity</p>
            <p id="Price">Price</p>
        </div>
        <hr class="hr-cart  ">
        <div id="cartItems"></div>
        <div class="total">
            <h3 class="text">Total: <span id="cart-total">$0.00</span></h3>
            <button id="checkout-btn"> Proceed to Checkout →</button>
        </div>
        <button id="clear-cart"><img src="" alt=""> Clear Cart</button>     
    </div>


    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <h2>Select Payment Method</h2>
            <form id="payment-form">
                <label>
                    <input type="radio" name="payment" value="online" checked> Online Payment
                </label>
                <label>
                    <input type="radio" name="payment" value="upi"> UPI
                </label>
                <label>
                    <input type="radio" name="payment" value="cod"> Cash on Delivery
                </label>
                <label>
                    <input type="radio" name="payment" value="netbanking"> Net Banking
                </label>
                <button type="submit" id="place-order">Place Order</button>
            </form>
        </div>
    </div>

    <!-- Success Animation -->
    <div id="success-animation" class="success">
        <img src="../Images/sucess.png" alt="Success">
        <h3>Order Placed Successfully!</h3>
    </div>  

    <div id="footer"></div>

    <script>
        // Load Header
        fetch("../Header/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
                updateCartBadge();
            })
            .catch(error => console.error("Error loading header:", error));

        // Load Footer
        fetch("../Footer/footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            })
            .catch(error => console.error("Error loading footer:", error));


    </script>
</body>

</html>
