<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Essence of Elegance</title>
    <link rel="stylesheet" href="../Styles/contackus.css">
</head>

<body>
    <!-- Header Section -->
    <header>
        <nav>
            <span class="logo">
                Essence of Elegance
            </span>
            <a href="home.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="#" class="active">Contact Us</a>
        </nav>
    </header>

    <!-- Contact Section -->
    <section class="contact">
        <h1>Contact Us</h1>
        <p>We’d love to hear from you! Reach out to us with your queries.</p>

        <div class="contact-form">
            <form id="contactForm">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Essence of Elegance. All rights reserved.</p>
    </footer>

    <script src="home.js"></script>
</body>

</html>
