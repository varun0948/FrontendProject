<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Know More</title>
    <link rel="stylesheet" href="../Header/header.css" />
    <link rel="stylesheet" href="../Footer/footer.css" />
    <link rel="stylesheet" href="../CSS/info.css" />
    <script src="../Script/info.js"></script>
  </head>
  <body>
    <div class="page-overlay">
      <div id="header"></div>

      
      <main>
        <div class="trip-container">
           <a href="info.html?trip=SouthKorea"></a>

          <div class="trip-card">
            <img id="trip-image" alt="Trip Image" class="trip-image" />
            <div class="trip-info">
              <h3 id="trip-title" class="trip-title"></h3>
              <p id="trip-destination" class="trip-destination"></p>
              <p id="trip-price" class="trip-price"></p>
              <p id="trip-description" class="trip-description"></p>
              <a href="#" class="book-btn">Book Now</a>
            </div>
          </div>

          <div class="additional-info">
            <h3>Day and Night Info</h3>
            <p id="day-night-info"></p>

            <h3>Trip Essentials</h3>
            <p id="trip-essentials"></p>

            <h3>Transportation</h3>
            <p id="transportation"></p>

            <h3>Accommodation</h3>
            <p id="accommodation"></p>

            <h3>Itinerary</h3>
            <p id="itinerary"></p>

            <h3>Contact Information</h3>
            <p id="contact-info"></p>

            <h3>Additional Information</h3>
            <p id="additional-info"></p>
          </div>
        </div>
        
        </a>
   
        
      </main>

      <div id="footer"></div>
    </div>

     </body>
</html>
<script>
  // Load Header
  fetch("../Header/header.html")
    .then((response) => response.text())
    .then((data) => {
      document.getElementById("header").innerHTML = data;
    })
    .catch((error) => console.error("Error loading header:", error));

  // Load Footer
  fetch("../Footer/footer.html")
    .then((response) => response.text())
    .then((data) => {
      document.getElementById("footer").innerHTML = data;
    })
    .catch((error) => console.error("Error loading footer:", error));
</script>
