<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Details</title>
  <script src="../Script/info.js"></script>
  <link rel="stylesheet" href="../CSS/info.css" />
</head>
<body>
  <div id="header0"></div>

  <main id="tripContent">
    <header class="hero" id="hero"></header>
    <div class="gallery" id="gallery"></div>
    <section id="whyLove"></section>
    <section id="itinerary"></section>
    <section id="priceBox"></section>
    <section id="reviews"></section>
    <section id="mapSection"></section>
    <section id="related"></section>
    <section class="social-sharing" id="socialSharing"></section>
  </main>

  <div id="footer"></div>

</body>
</html>

<script>
  // Load Header
  fetch("../Header/header.html")
    .then((response) => response.text())
    .then((data) => {
      document.getElementById("header0").innerHTML = data;
    })
    .catch((error) => console.error("Error loading header:", error));

  // Load Footer
  fetch("../Footer/footer.html")
    .then((response) => response.text())
    .then((data) => {
      document.getElementById("footer").innerHTML = data;
    })
    .catch((error) => console.error("Error loading footer:", error));
</script>
